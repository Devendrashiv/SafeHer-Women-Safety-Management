{% extends "base.html" %}{% block title %}Report an Incident{% endblock %}
{% block content %}<section class="form-wrap"><div class="form-card form-wide"><span class="eyebrow">SHARE A CONCERN</span><h1>Report an incident</h1><p class="muted">Only share information you are comfortable storing in this demo application.</p>
<form method="post"><label>Incident category</label><select name="category" required><option value="">Select category</option><option>Harassment</option><option>Unsafe location</option><option>Stalking</option><option>Online abuse</option><option>Other</option></select><label>Location (optional)</label><input name="location" maxlength="200" placeholder="Area or landmark"><label>Description</label><textarea name="description" rows="6" minlength="10" maxlength="3000" required placeholder="Describe what happened..."></textarea><button class="btn primary full">Submit report</button></form></div></section>{% endblock %}
